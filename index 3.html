<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
:root{--p:#1B7A2F;--pd:#0F4A1C;--p2:#2E9B47;--s:#E6F0E7;--bg:#F4F8F4;--t:#1F2A21;--t2:#4A5A4D;--w:#FFE9B0;--ow:#5C3B00;--e:#B3261E;--am:#F5A524;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font:400 18px/1.65 "Noto Sans Thai",system-ui,sans-serif;color:var(--t);background:radial-gradient(900px 420px at 100% -10%,#d3ead6,transparent),var(--bg)}
header{position:sticky;top:0;z-index:2000;background:#0F4A1Cf0;backdrop-filter:blur(8px);color:#fff;box-shadow:0 2px 14px #0f4a1c44}
.hd{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hd img{width:52px;height:52px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 3px #ffffff55}
.hd b{display:block;font-size:17px;line-height:1.3;font-weight:600}.hd span{font-size:13px;opacity:.85}
main{max-width:1180px;margin:auto;padding:16px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{text-align:center;font-size:13px;color:var(--t2);padding:20px 16px 28px}
h1{font-size:28px;line-height:1.3;margin:6px 0 12px;font-weight:600}h2{font-size:20px;line-height:1.35;margin:0 0 10px;font-weight:600}
.hero{display:flex;flex-direction:column;gap:18px;align-items:flex-start;background:linear-gradient(135deg,var(--pd),var(--p) 55%,var(--p2));color:#fff;border-radius:24px;padding:24px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 12px 32px #1b7a2f44}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:#ffffff14}
.hero h1{margin:0 0 8px;font-size:26px;color:#fff}.hero p{margin:0;opacity:.93;font-size:16px;max-width:520px}
.hero .btn{width:auto;min-width:210px;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats div{background:#fff;border-radius:16px;padding:10px 8px;text-align:center;box-shadow:0 2px 10px #1f2a2110;border:1px solid #e3ece4}
.stats b{display:block;font-size:22px;color:var(--p);line-height:1.2}.stats span{font-size:13px;color:var(--t2)}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #1f2a2112;border:1px solid #e3ece4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:8px 20px;border:0;border-radius:14px;font:600 18px "Noto Sans Thai",sans-serif;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;cursor:pointer;box-shadow:0 4px 14px #1b7a2f55;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--s);color:var(--pd);box-shadow:none}.btn.amber{background:linear-gradient(135deg,#FFB938,var(--am));color:#3a2600;box-shadow:0 4px 14px #0003}
.btn:disabled{opacity:.6}.btn+.btn{margin-top:10px}.btn.fit{width:auto}
:focus-visible{outline:3px solid #0B57D0;outline-offset:2px}
label{display:block;font-weight:600;margin-bottom:4px}
input[type=text]{width:100%;min-height:54px;padding:8px 16px;border:2px solid #b7c8b9;border-radius:14px;font:18px "Noto Sans Thai",sans-serif;margin-bottom:4px;background:#fcfdfc}
input[type=text]:focus{border-color:var(--p);outline:0;box-shadow:0 0 0 4px #1b7a2f26}input.bad{border-color:var(--e)}
.help{font-size:16px;color:var(--t2);margin:0 0 14px}.err{color:var(--e);font-size:15px;font-weight:600;margin:0 0 14px}
.seg{display:flex;gap:6px;margin-bottom:18px;background:var(--s);padding:5px;border-radius:16px}
.seg button{flex:1;min-height:48px;border:0;border-radius:12px;background:transparent;color:var(--pd);font:600 17px "Noto Sans Thai",sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--p);color:#fff;box-shadow:0 3px 10px #1b7a2f44}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1.5px solid var(--p);background:#fff;color:var(--pd);border-radius:99px;padding:6px 16px;font:600 15px "Noto Sans Thai",sans-serif;cursor:pointer}
.chip:hover{background:var(--s)}
.steps{margin:0;padding:0;list-style:none;counter-reset:n}.steps li{counter-increment:n;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.steps li:before{content:counter(n);flex:none;width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.notice{background:var(--s);color:var(--pd);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.55}
.alert{background:var(--w);color:var(--ow);border-radius:16px;padding:16px 18px;margin:12px 0;border-left:6px solid #E6A100}
.alert ul{margin:8px 0 0;padding-left:20px}
.banner{display:flex;gap:14px;align-items:flex-start;border-radius:20px;padding:18px 20px;margin-bottom:16px}
.banner.ok{background:#E3F4E5;color:#14521F;border:1px solid #bfe0c3}.banner.warn{background:var(--w);color:var(--ow);border:1px solid #f1d27a}
.banner .ic{font-size:32px;line-height:1.1}.banner h2{margin:0 0 4px;font-size:22px}.banner p{margin:0;font-size:19px;line-height:1.55}
.badge{display:inline-flex;gap:6px;align-items:center;background:#2E7D32;color:#fff;border-radius:99px;padding:5px 16px;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--bg);border-radius:14px;padding:10px 12px}
.tile small{display:block;color:var(--t2);font-size:13px}.tile b{font-weight:600;font-size:16px}
.zone{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--s)}.zone:first-of-type{border-top:0}
.layer{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--s);cursor:pointer;margin:0;font-weight:400}
.layer .tx{flex:1;line-height:1.35}.layer b{font-weight:600}
.layer small{display:block;font-size:14px;color:var(--t2);margin-top:2px}
.layer input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:#b9c6bb;position:relative;flex:none;margin:0;cursor:pointer;transition:.2s}
.layer input:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.layer input:checked{background:var(--p)}.layer input:checked:after{left:23px}
.mapwrap{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 8px 28px #1f2a2133;border:4px solid #fff}
#map{height:60vh;min-height:380px;background:#2c3a2f}#mini{height:240px;background:#2c3a2f}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:800;background:#0F4A1Cdd;color:#fff;border-radius:99px;padding:6px 16px;font-size:14px;pointer-events:none;white-space:nowrap}
.none{position:absolute;inset:0;z-index:999;background:#f4f8f4ee;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--t2)}.none[hidden]{display:none}
.empty{text-align:center;padding:48px 16px;color:var(--t2)}
.grid{display:grid;gap:16px}
@media(min-width:700px){.hero{flex-direction:row;align-items:center;justify-content:space-between;padding:32px 36px}.hero h1{font-size:34px}}
@media(min-width:900px){.grid{grid-template-columns:1.9fr 1fr;align-items:start}.g2{grid-template-columns:1fr 1fr}#map{height:68vh}main{padding:24px}}
.crumb{display:flex;gap:8px;font-size:14px;color:var(--t2);margin:4px 0 8px}.crumb .on{color:var(--p);font-weight:600}
.leg{display:flex;gap:10px;align-items:center;font-size:15px;margin:5px 0}
.sw{width:32px;height:22px;border-radius:5px;border:2px solid;flex:none}
.sw-parcel{background:#fff6;border-color:#1F2A21}
.sw-spk{border-color:#7CB342;background:repeating-linear-gradient(45deg,#7CB342 0 3px,#DCEDC8 3px 8px)}
.sw-forest{border-color:#00796B;background:radial-gradient(#00796B 2px,#B2DFDB 2.5px) 0 0/8px 8px}
.sw-park{border-color:#8D6E63;background:linear-gradient(45deg,transparent 45%,#8D6E63 45% 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#8D6E63 45% 55%,#D7CCC8 55%);background-size:9px 9px}
.spin{width:40px;height:40px;border:5px solid var(--s);border-top-color:var(--p);border-radius:50%;animation:r 1s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
.z-spk{fill:url(#pat-s)!important}.z-forest{fill:url(#pat-f)!important}.z-park{fill:url(#pat-p)!important}
.lbl{background:#fff;color:var(--t);border:0;font:600 14px "Noto Sans Thai",sans-serif;box-shadow:0 1px 4px #0006;padding:2px 8px;border-radius:6px}
.sk{border-radius:12px;background:linear-gradient(90deg,#e6efe7 25%,#f4f8f4 50%,#e6efe7 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{display:none}
@media(max-width:699px){nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:2000;background:#fff;border-top:1px solid #dfe8e0;gap:8px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px #1f2a2114}

const $=h=>{document.getElementById("app").innerHTML=h};
const sat=(m,full)=>{m.createPane("fb");m.getPane("fb").style.zIndex=150;let fb=0;
 const T="https://server.arcgisonline.com/ArcGIS/rest/services/";
 const img=L.tileLayer(T+"World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:18,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"});
 const lab=L.tileLayer(T+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:18});
 img.on("tileerror",()=>{if(!fb){fb=1;L.imageOverlay(FB,AREA,{pane:"fb"}).addTo(m)}});
 const base=L.layerGroup([img,lab]).addTo(m);
 if(full){const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"});
  L.control.layers({"ดาวเทียม + ชื่อสถานที่":base,"แผนที่ถนน":osm},null,{position:"topright"}).addTo(m);L.control.scale({imperial:false}).addTo(m)}
 return base};
const disc=`<p class="notice">ข้อมูลนี้เป็นข้อมูลจำลองเพื่อการเรียนรู้ ไม่ใช่การรับรองสิทธิ์ตามกฎหมาย และไม่ใช่ระบบทางการของหน่วยงานใด ภาพดาวเทียมใช้เป็นพื้นหลังประกอบเท่านั้น</p>`;
const go=v=>{S.v=v;render();scrollTo(0,0)};
const load=(v,msg)=>{$(`<div class="card" role="status"><p class="help" style="font-weight:600;margin-bottom:12px">${msg}…</p><div class="sk" style="height:30px;width:65%"></div><div class="sk" style="height:96px;margin-top:14px"></div><div class="sk" style="height:200px;margin-top:14px"></div></div>`);setTimeout(()=>go(v),700)};
const pick=k=>{S.sel=k;load("s3","กำลังตรวจสอบแปลง")};
const render=()=>{({s1,s2,s3})[S.v]();document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==(S.v=="s1"?"s1":"s2")))};
const zpoly=k=>L.polygon(poly(Z[k].pts),{className:"z-"+k,color:Z[k].c,weight:2.5,fillOpacity:1}).bindTooltip(Z[k].t,{sticky:true});
const sw=k=>`<span class="sw sw-${k}"></span>`;
function s1(){
 if(S.mapErr||!window.L)return $(`<div class="card empty"><h2>โหลดแผนที่ไม่สำเร็จ</h2><p>กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง คุณยังค้นหาแปลงด้วยเลขโฉนดหรือพิกัดได้</p><button class="btn" onclick="${window.L?"S.mapErr=0;load('s1','กำลังโหลดแผนที่')":"location.reload()"}">ลองอีกครั้ง</button><button class="btn sec" onclick="go('s2')">ค้นหาแปลง</button></div>`);
 $(`<section class="hero"><div><h1>ตรวจสอบแปลงที่ดิน<br>ได้ในไม่กี่ขั้นตอน</h1><p>ค้นหาด้วยเลขโฉนดหรือพิกัด แล้วดูว่าแปลงซ้อนทับกับเขตใดบ้าง บนภาพดาวเทียม</p></div><button class="btn amber" onclick="go('s2')">🔍 ค้นหาแปลง</button></section>
 <div class="stats"><div><b>3</b><span>แปลงตัวอย่าง</span></div><div><b>4</b><span>ชั้นข้อมูล</span></div><div><b>พะเยา</b><span>พื้นที่ตัวอย่าง</span></div></div>
 <div class="grid"><div><div class="mapwrap"><div id="map"></div><div class="hint">👆 แตะแปลงบนแผนที่เพื่อตรวจสอบ</div><div class="none" id="none" hidden>ยังไม่ได้เปิดชั้นข้อมูลใด<br>กรุณาเปิดอย่างน้อย 1 ชั้นข้อมูล</div></div></div>
 <div><div class="card"><h2>ชั้นข้อมูล</h2>${LAYERS.map(l=>`<label class="layer">${sw(l[0])}<span class="tx"><b>${l[1]}</b><small>${l[2]}</small></span><input type="checkbox" aria-label="${l[1]}" ${S.on[l[0]]?"checked":""} onchange="tog('${l[0]}')"></label>`).join("")}</div>
 <div class="card"><h2>คำอธิบายสัญลักษณ์</h2>${LAYERS.map(l=>`<div class="leg">${sw(l[0])} ${l[1]}</div>`).join("")}<div class="leg"><span class="sw" style="border-color:#FF6D00;border-width:4px"></span> แปลงที่เลือก</div></div>${disc}</div></div>`);
 M=L.map("map",{maxZoom:19,minZoom:11}).fitBounds(AREA);sat(M,1);
 G={spk:L.layerGroup([zpoly("spk")]),forest:L.layerGroup([zpoly("forest")]),park:L.layerGroup([zpoly("park")]),
  parcel:L.layerGroup(Object.keys(P).map(k=>{const hi=S.hi==k;return L.polygon(poly(P[k].pts),{color:hi?"#FF6D00":"#fff",weight:hi?6:3,fillColor:"#fff",fillOpacity:.18})
   .bindTooltip("แปลง "+P[k].id,{permanent:true,direction:"center",className:"lbl"}).on("click",()=>pick(k))}))};
 Object.keys(G).forEach(k=>S.on[k]&&G[k].addTo(M));
 if(S.hi){M.fitBounds(L.polygon(poly(P[S.hi].pts)).getBounds().pad(2));S.hi=null}
 upd()}
function upd(){document.getElementById("none").hidden=Object.values(S.on).some(x=>x)}
function tog(k){S.on[k]=S.on[k]?0:1;S.on[k]?G[k].addTo(M):M.removeLayer(G[k]);upd()}
function ex(k){S.mode="deed";S.deed=k;s2()}
function exc(){S.mode="xy";S.lat=EX[0];S.lng=EX[1];s2()}
function s2(){const d=S.mode=="deed";
 $(`<div class="crumb"><span>แผนที่</span> › <span class="on">ค้นหาแปลง</span> › <span>ผลตรวจสอบ</span></div><button class="btn sec fit" onclick="go('s1')">← กลับไปแผนที่</button><h1 style="margin-top:14px">ค้นหาแปลง</h1>
 <div class="grid g2"><div class="card"><div class="seg" role="group" aria-label="วิธีค้นหา"><button aria-pressed="${d}" onclick="sm('deed')">เลขโฉนด</button><button aria-pressed="${!d}" onclick="sm('xy')">พิกัด</button></div>
 ${d?`<label for="deed">เลขที่โฉนด</label><input type="text" id="deed" inputmode="numeric" value="${S.deed}"><p class="help">ตัวอย่าง: 10001</p><div class="chips"><span class="help" style="margin:6px 4px 0 0">ลองกด:</span>${["10001","10002","10003","99999"].map(k=>`<button class="chip" onclick="ex('${k}')">${k}</button>`).join("")}</div>`:
 `<label for="lat">ละติจูด</label><input type="text" id="lat" inputmode="decimal" value="${S.lat}"><p class="help">ตัวอย่าง: ${EX[0]}</p><label for="lng">ลองจิจูด</label><input type="text" id="lng" inputmode="decimal" value="${S.lng}"><p class="help">ตัวอย่าง: ${EX[1]} (พื้นที่ตัวอย่างอยู่ในช่วง ${RLAT} และ ${RLNG})</p><div class="chips"><button class="chip" onclick="exc()">ใช้พิกัดตัวอย่าง</button></div>`}
 <div id="m"></div><button class="btn" id="go" onclick="srch()">🔍 ค้นหาแปลง</button></div>
 <div><div class="card"><h2>ขั้นตอน</h2><ol class="steps"><li>เลือกวิธีค้นหา เลขโฉนดหรือพิกัด</li><li>กรอกข้อมูล แล้วกดค้นหาแปลง</li><li>อ่านข้อความสรุปและดูแผนที่ย่อ</li></ol></div>${disc}</div></div>`)}
function sm(m){S.mode=m;s2()}
function fe(id,msg){const i=document.getElementById(id);i.className="bad";i.nextElementSibling.outerHTML=`<p class="err" role="alert">⚠ ${msg}</p>`}
function srch(){let k,ok=1;
 if(S.mode=="deed"){S.deed=deed.value.trim();if(!S.deed)return fe("deed","กรุณากรอกเลขที่โฉนด เช่น 10001");k=S.deed}
 else{S.lat=lat.value.trim();S.lng=lng.value.trim();const a=parseFloat(S.lat),b=parseFloat(S.lng);
  if(isNaN(a)){fe("lat","กรุณากรอกละติจูดเป็นตัวเลข เช่น "+EX[0]);ok=0}
  if(isNaN(b)){fe("lng","กรุณากรอกลองจิจูดเป็นตัวเลข เช่น "+EX[1]);ok=0}
  if(!ok)return;
  if(a<LAT0||a>LAT0+SPAN||b<LNG0||b>LNG0+SPAN)return fe("lat","พิกัดนี้อยู่นอกพื้นที่ตัวอย่าง กรุณากรอกละติจูด "+RLAT+" และลองจิจูด "+RLNG);
  k=Object.keys(P).find(x=>Math.abs(P[x].ll[0]-a)<.008&&Math.abs(P[x].ll[1]-b)<.008)||"-"}
 const g=document.getElementById("go");g.disabled=true;g.textContent="กำลังค้นหาแปลง…";
 setTimeout(()=>{if(!P[k]){s2();document.getElementById("m").innerHTML=`<div class="alert" role="alert"><b>ไม่พบแปลงที่ตรงกับข้อมูลที่กรอก</b><ul><li>ตรวจสอบว่ากรอกเลขโฉนดหรือพิกัดถูกต้อง</li><li>ลองค้นหาด้วยวิธีอื่น หรือเลือกแปลงจากแผนที่</li></ul></div>`;return}S.sel=k;go("s3")},800)}
function s3(){
 if(S.resErr)return $(`<div class="card empty"><h2>โหลดผลไม่สำเร็จ</h2><p>กรุณาลองอีกครั้ง</p><button class="btn" onclick="S.resErr=0;load('s3','กำลังตรวจสอบแปลง')">ลองอีกครั้ง</button></div>`);
 const k=S.sel,p=P[k],n=p.z.length;
 const sum=n?`แปลงนี้มีบริเวณที่ซ้อนทับกับ${p.z.map(z=>Z[z].t).join("และ")}ตามข้อมูลจำลอง`:"ไม่พบการซ้อนทับกับเขตใดตามข้อมูลจำลองที่ใช้ตรวจสอบ";
 $(`<div class="crumb"><span>แผนที่</span> › <span>ค้นหาแปลง</span> › <span class="on">ผลตรวจสอบ</span></div><h1>ผลการตรวจสอบแปลง ${p.id}</h1>
 <div class="banner ${n?"warn":"ok"}" role="status"><span class="ic">${n?"⚠️":"✅"}</span><div><h2>${n?"พบพื้นที่ซ้อนทับ "+n+" เขต":"ไม่พบการซ้อนทับ"}</h2><p>${sum}</p></div></div>
 <div class="grid"><div>
 <div class="card"><h2>สถานะสิทธิ์</h2><span class="badge">✔ ข้อมูลสถานะสิทธิ์ตามข้อมูลจำลอง</span></div>
 ${n?`<div class="card"><h2>เขตที่ซ้อนทับ</h2>${p.z.map(z=>`<div class="zone">${sw(z)}<div><b>${Z[z].n}</b><br><span class="help" style="margin:0">ประเภท: ${Z[z].d}<br>หน่วยงานเจ้าของข้อมูล: ${Z[z].a}</span></div></div>`).join("")}</div>`:""}
 <div class="card"><h2>รายละเอียดแปลง</h2><div class="tiles"><div class="tile"><small>เลขที่โฉนด</small><b>${k}</b></div><div class="tile"><small>เนื้อที่</small><b>${p.area}</b></div><div class="tile" style="grid-column:1/-1"><small>ประเภทเอกสาร</small><b>โฉนดที่ดิน (ข้อมูลจำลอง)</b></div><div class="tile" style="grid-column:1/-1"><small>ที่ตั้ง</small><b>${p.loc} ตำบลบ้านตัวอย่าง อำเภอเมืองสมมติ จังหวัดสมมติ</b></div></div></div></div>
 <div><div class="card"><h2>แผนที่ย่อ</h2><div class="mapwrap"><div id="mini"></div></div><div style="margin-top:10px">${p.z.map(z=>`<div class="leg">${sw(z)} ${Z[z].t}</div>`).join("")}<div class="leg">${sw("parcel")} แปลง ${p.id}</div></div></div>${disc}
 <button class="btn" style="margin-top:14px" onclick="go('s2')">🔍 ค้นหาแปลงอื่น</button><button class="btn sec" onclick="S.hi='${k}';go('s1')">🗺️ ดูบนแผนที่</button></div></div>`);
 if(!window.L){document.getElementById("mini").innerHTML=`<img src="${FB}" alt="ภาพจำลองพื้นที่" style="width:100%;display:block">`;return}
 const m=L.map("mini",{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false});sat(m);
 p.z.forEach(z=>zpoly(z).addTo(m));
 const pp=L.polygon(poly(p.pts),{color:"#FF6D00",weight:4,fillColor:"#fff",fillOpacity:.2}).addTo(m);
 const b=p.z.reduce((a,z)=>a.extend(L.polygon(poly(Z[z].pts)).getBounds()),pp.getBounds());m.fitBounds(b.pad(.1))}
render();

</script>
</body></html>
